<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello</title>
  <!-- lerd styles this page like the dashboard: use its lerd-* classes and write layout only. -->
</head>
<body>
  <span class="lerd-label">Hello</span>
  <pre id="out" class="lerd-card lerd-mono">Loading...</pre>
  <script src="lerd.js"></script>
  <script>
    const out = document.getElementById('out');
    lerd.api('greet?site=' + encodeURIComponent(lerd.context.site))
      .then((text) => { out.textContent = text; })
      .catch((err) => { out.textContent = err.message; });
  </script>
</body>
</html>
