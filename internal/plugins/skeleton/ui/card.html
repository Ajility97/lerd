<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello</title>
  <style>
    /* lerd styles buttons, fields and text in the dashboard's theme; write layout only. */
    body { margin: 0; padding: 12px 14px; font-size: 13px; }
  </style>
</head>
<body>
  <span id="out">Loading...</span>
  <script src="lerd.js"></script>
  <script>
    const out = document.getElementById('out');
    lerd.api('greet?site=' + encodeURIComponent(lerd.context.site))
      .then((text) => { out.textContent = text; })
      .catch((err) => { out.textContent = err.message; });
  </script>
</body>
</html>
