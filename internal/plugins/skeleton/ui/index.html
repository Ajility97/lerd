<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello</title>
  <!-- lerd styles this page like the dashboard: use its lerd-* classes and write layout only. -->
</head>
<body>
  <section class="lerd-section">
    <span class="lerd-label">Hello</span>
    <p class="lerd-muted">This page lives in the plugin's <code>ui/</code> folder and talks to its own <code>api</code> endpoint.</p>
    <form id="f" class="lerd-toolbar"><input id="site" placeholder="site name" required> <button class="primary">Greet</button></form>
    <pre id="out" class="lerd-card lerd-mono"></pre>
  </section>
  <script src="lerd.js"></script>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const site = document.getElementById('site').value;
      const out = document.getElementById('out');
      try {
        out.textContent = await lerd.api('greet?site=' + encodeURIComponent(site));
      } catch (err) {
        out.textContent = err.message;
      }
    });
  </script>
</body>
</html>
