<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Lerd · share image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---- Tokens lifted from the landing page ---- */
      :root {
        --bg: #0a0a0b;
        --bg-2: #0e0e10;
        --panel: #131316;
        --line: #26262c;
        --line-2: #34343c;
        --ink: #f4f4f5;
        --ink-2: #c4c4cc;
        --muted: #8b8b95;
        --accent: #ff2d20;
        --accent-2: #ff5b50;
        --accent-glow: rgba(255, 45, 32, 0.45);
        --accent-wash: rgba(255, 45, 32, 0.16);
        --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", "Cascadia Code", monospace;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: #050506;
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* The screenshot target: a fixed 1200x630 (1.91:1) OG frame. */
      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
      }

      /* Featured-article variant: the same composition on a 2:1 frame, shot at
         2x for 2200x1100. Add ?featured to the URL, or the class from a
         capture script. The window keeps its size and re-centres on the
         shorter frame, so only the vertical breathing room changes. */
      .frame.featured { height: 600px; }

      /* The landing hero's red wash, from the top-left corner. */
      .frame::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(50% 70% at 8% 0%, rgba(255, 45, 32, 0.16), transparent 70%);
      }

      /* ---- Left: brand + headline + sub ---- */
      .copy {
        position: absolute;
        z-index: 3;
        left: 76px;
        top: 0;
        bottom: 0;
        width: 510px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .label {
        display: flex;
        align-items: center;
        gap: 12px;
        font: 500 14px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .label img { width: 28px; height: 28px; display: block; }
      h1 {
        margin: 26px 0 0;
        font-weight: 700;
        font-size: 132px;
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      h1 span {
        display: block;
        margin-top: 0.22em;
        font-size: 0.33em;
        line-height: 1.08;
        letter-spacing: -0.03em;
        color: #5d5d66;
      }
      .sub {
        margin: 30px 0 0;
        font: 15px/1 var(--mono);
        color: var(--muted);
      }

      /* ---- Right: the dashboard demo, bleeding off and fading to dark ---- */
      .shot {
        position: absolute;
        z-index: 1;
        top: 50%;
        right: -88px;
        transform: translateY(-50%);
        width: 700px;
        height: 420px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #0d0d0d;
        overflow: hidden;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.04) inset,
          0 40px 90px -28px rgba(0, 0, 0, 0.85);
      }
      .shot-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 22px;
        padding: 0 10px;
        background: #161616;
      }
      .dots { display: flex; gap: 5px; }
      .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
      .dots i:nth-child(1) { background: #ff5f57; }
      .dots i:nth-child(2) { background: #febc2e; }
      .dots i:nth-child(3) { background: #28c840; }
      .shot-body { position: relative; height: calc(100% - 22px); overflow: hidden; }
      /* Render the demo at a wide logical viewport, then scale it down so the
         full desktop dashboard fits inside the window chrome. */
      .shot-body iframe {
        width: 1480px;
        height: 827px;
        border: 0;
        /* Up one pixel: the scaled frame's top row shows the page behind the demo. */
        transform: translateY(-1px) scale(0.4716);
        transform-origin: top left;
        background: #0d0d0d;
      }

      /* Fade the panel into the dark bg on the right and bottom edges. */
      .fade {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(180deg, transparent 72%, rgba(10, 10, 11, 0.6) 92%, var(--bg) 100%);
      }
      /* Frame-level right-edge fade — dims the demo as it reaches the true frame
         edge (the window itself bleeds off-frame and would be clipped). */
      .edge {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(90deg, transparent 72%, rgba(10, 10, 11, 0.55) 88%, var(--bg) 100%);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <!-- dashboard demo, behind the copy, fading right/bottom -->
      <div class="shot">
        <div class="shot-bar">
          <span class="dots"><i></i><i></i><i></i></span>
        </div>
        <div class="shot-body">
          <iframe id="demo" src="/demo/index.html" title="Lerd dashboard" loading="eager"></iframe>
          <div class="fade"></div>
        </div>
      </div>
      <div class="edge"></div>

      <!-- brand + message -->
      <div class="copy">
        <div class="label"><img src="/assets/logo.svg" alt="" /><span>Open source, rootless, no Docker</span></div>
        <h1>Lerd <span>Local PHP development for Linux and macOS</span></h1>
        <p class="sub">lerd.sh</p>
      </div>
    </div>
    <script>
      // The window is drawn as the desktop app, whose title bar is the dashboard's header colour.
      document.getElementById('demo').addEventListener('load', (e) => {
        const rail = e.target.contentDocument.querySelector('aside');
        // The body takes the colour too, so the scaled frame's sub-pixel edge leaves no seam under the bar.
        if (rail) for (const el of document.querySelectorAll('.shot-bar, .shot')) el.style.background = getComputedStyle(rail).backgroundColor;
      });
      if (location.search.includes('featured')) {
        document.querySelector('.frame').classList.add('featured');
      }
    </script>
  </body>
</html>
